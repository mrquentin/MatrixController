name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ubuntu-latest already ships Android platform android-37.0 and build-tools 37.0.0,
      # so no android-actions/setup-android step is needed.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # assembleDebugAndroidTest compiles the Compose UI tests so they cannot rot. They are not
      # *run* here: minSdk 37 means the only available system image is the full
      # `android-37.0;google_apis` one — no ATD (CI-optimised) image exists above API 36 — and on
      # hosted runners it either exceeded the boot timeout or came up with /sdcard unmounted and
      # the app APK not yet installed, which fails every test. Run them locally instead:
      #     ./gradlew connectedDebugAndroidTest
      # Verified green on an API 37 emulator and on a physical Pixel 10 Pro XL (API 37).
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      # v4 targets the deprecated Node 20 runtime; v7 is the current Node 24 major.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/outputs/apk/debug/*.apk
