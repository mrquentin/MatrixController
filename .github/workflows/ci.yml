name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ubuntu-latest already ships Android platform android-37.0 and build-tools 37.0.0,
      # so no android-actions/setup-android step is needed.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # assembleDebugAndroidTest keeps the instrumented sources compiling in this fast job;
      # the `instrumented` job below actually runs them on an emulator.
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      # v4 targets the deprecated Node 20 runtime; v7 is the current Node 24 major.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/outputs/apk/debug/*.apk

  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      # The emulator needs KVM, which ubuntu-latest has but does not expose to non-root by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Minor-versioned naming: `platforms;android-37` does not exist, only `android-37.0`.
          # `system-images;android-37.0;google_apis;x86_64` is the matching image.
          api-level: '37.0'
          system-image-api-level: '37.0'
          target: google_apis
          arch: x86_64
          # No ATD (CI-optimised) image exists above API 36, so this is the full image and it
          # boots slowly on a hosted runner; the 600 s default is not enough.
          emulator-boot-timeout: 1800
          ram-size: 4096M
          disk-size: 8G
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/**
